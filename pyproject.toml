[project]
name = "wastewise-ml-collab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Amos Shehzad", email = "lukkygill26@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
]

[project.scripts]
wastewise-ml-collab = "wastewise_ml_collab:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "detect-secrets>=1.5.0",
    "dvc[s3]>=3.67.1",
    "jupytext>=1.19.5",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
]
[tool.ruff.lint]
ignore = ["E402"]
